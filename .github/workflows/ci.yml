# Tests, builds and reproducibility checks on every push and PR.
# The backend jobs install from requirements.lock (exact pins of the environment tests are known to
# pass on); requirements.txt keeps the human-readable ranges. Dependency scans are blocking.
# A failed required test or artifact drift must fail CI; no continue-on-error.

name: CI

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -r backend/requirements.lock
      - run: pytest -q --ignore=tests/test_pons_contract.py --ignore=tests/test_pons_contract_v2.py --ignore=tests/test_rewards_contract.py
        working-directory: backend

  contract-tests:
    # The Solidity bytecode tests run real EVM simulation and are slow enough to warrant their own job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -r backend/requirements.lock
      - run: pytest tests/test_pons_contract.py tests/test_pons_contract_v2.py tests/test_rewards_contract.py -q
        working-directory: backend

  postgres-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: helm_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: helm_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helm_test -d helm_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -r backend/requirements.lock
      - run: pytest tests/test_postgres_execution.py -q
        working-directory: backend
        env:
          SIGNER: local
          HELM_TEST_POSTGRES_URL: postgresql+asyncpg://helm_test:isolated-ci-only@127.0.0.1:5432/helm_audit_test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: contracts
      # Compare with committed artifacts before any command can overwrite them.
      - run: npm run check
        working-directory: contracts
      - run: npm test
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend

  audit-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
  audit-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm audit --audit-level=high
        working-directory: frontend

